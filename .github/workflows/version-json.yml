# When a release is published, version.json (the A-M-T updater's backup source) is written from it:
# version, date, notes (English / Arabic, split at the "---" line), installer link, size and SHA-256.
# The commit to main makes Cloudflare Pages redeploy the site.
name: Update version.json from the latest release

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Write version.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" -o release.json
          url=$(jq -r '[.assets[] | select(.name | test("\\.exe$"; "i"))] | (map(select(.name | test("^A-M-T-Setup"; "i"))) + .) | .[0].browser_download_url // empty' release.json)
          if [ -z "$url" ]; then echo "The latest release has no .exe installer."; exit 1; fi
          curl -fsSL "$url" -o setup.exe
          sha=$(sha256sum setup.exe | cut -d' ' -f1)
          size=$(stat -c %s setup.exe)
          python3 - "$url" "$sha" "$size" <<'PY'
          import json, re, sys
          url, sha, size = sys.argv[1], sys.argv[2], int(sys.argv[3])
          r = json.load(open('release.json', encoding='utf-8'))
          version = re.search(r'\d+(?:\.\d+){1,3}', r.get('tag_name') or r.get('name') or '').group(0)
          body = (r.get('body') or '').replace('\r', '')
          parts = re.split(r'\n-{3,}\s*\n', body, maxsplit=1)
          def bullets(text):
              out = []
              for line in text.split('\n'):
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  line = re.sub(r'^[-*]\s+', '', line).replace('**', '').replace('`', '')
                  out.append(line)
              return out[:40]
          data = {
              "version": version,
              "released": (r.get('published_at') or '')[:10],
              "notes": bullets(parts[0]),
              "notes_ar": bullets(parts[1]) if len(parts) > 1 else [],
              "installer": url,
              "release_url": r.get('html_url'),
              "sha256": sha,
              "size": size,
          }
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          rm -f release.json setup.exe

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet && echo "version.json already up to date" || (git commit -m "version.json: latest release" && git push)
